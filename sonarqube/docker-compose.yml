version: "3.8"

# Local SonarQube Community for ACEest Fitness (DevOps Assignment 2 - Step 6)
# Exposes:  http://localhost:9000  (default login admin / admin -> forces change on first run)
# Data is persisted in named volumes so analyses survive container restarts.

services:
  sonarqube:
    image: sonarqube:10-community
    container_name: aceest-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:15-alpine
    container_name: aceest-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
