# =============================================================
# Strategy 2 - BLUE / GREEN
# =============================================================
# - Two full deployments: aceest-blue (v1) + aceest-green (v2).
# - One Service whose `selector.color` decides which colour serves traffic.
# - Switch traffic instantly:
#     kubectl -n aceest patch svc aceest-bluegreen \
#       -p '{"spec":{"selector":{"app":"aceest-fitness","color":"green"}}}'
# - Rollback:  patch the selector back to "blue".
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: { app: aceest-fitness, color: blue, strategy: blue-green }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-fitness, color: blue }
  template:
    metadata:
      labels: { app: aceest-fitness, color: blue, strategy: blue-green }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest   # v1 = "blue"
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: { app: aceest-fitness, color: green, strategy: blue-green }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-fitness, color: green }
  template:
    metadata:
      labels: { app: aceest-fitness, color: green, strategy: blue-green }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest   # bump to v2 to deploy green
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
# Public Service - currently sends traffic to BLUE.
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels: { app: aceest-fitness, strategy: blue-green }
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    color: blue           # <-- flip to "green" to cut traffic over
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
