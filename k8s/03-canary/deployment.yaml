# =============================================================
# Strategy 3 - CANARY  (~80 / 20 traffic split using replica counts)
# =============================================================
# - Two deployments share `app=aceest-canary` so one Service load-balances
#   across BOTH versions; the ratio is controlled by replica counts.
# - 4 stable replicas + 1 canary replica  -> ~20 % traffic to canary.
# - Promote canary -> scale stable down to 0, scale canary up.
# - Rollback     -> scale canary down to 0.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels: { app: aceest-canary, track: stable, strategy: canary }
spec:
  replicas: 4
  selector:
    matchLabels: { app: aceest-canary, track: stable }
  template:
    metadata:
      labels: { app: aceest-canary, track: stable, strategy: canary }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest   # current production version
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: { app: aceest-canary, track: canary, strategy: canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aceest-canary, track: canary }
  template:
    metadata:
      labels: { app: aceest-canary, track: canary, strategy: canary }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest   # candidate version under test
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
  namespace: aceest
  labels: { app: aceest-canary, strategy: canary }
spec:
  type: NodePort
  selector:
    app: aceest-canary       # selects BOTH stable + canary pods
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
