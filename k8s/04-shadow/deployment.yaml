# =============================================================
# Strategy 4 - SHADOW (Traffic Mirroring)
# =============================================================
# - Production deployment serves all real user traffic.
# - Shadow deployment runs the candidate version - it receives a COPY
#   of production traffic generated by an in-cluster traffic-mirror Job
#   (see shadow-mirror-job.yaml). End users never see shadow responses.
# - Used to load-test / regression-test a new version safely.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-prod
  namespace: aceest
  labels: { app: aceest-prod, strategy: shadow, role: production }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-prod }
  template:
    metadata:
      labels: { app: aceest-prod, strategy: shadow, role: production }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: { app: aceest-shadow, strategy: shadow, role: shadow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aceest-shadow }
  template:
    metadata:
      labels: { app: aceest-shadow, strategy: shadow, role: shadow }
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93650/aceest-fitness:latest   # candidate version
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          env:
            - { name: ACEEST_MODE, value: "shadow" }
          readinessProbe: { httpGet: { path: /health, port: 5000 }, periodSeconds: 5 }
---
# Public Service - real users only hit the production pods.
apiVersion: v1
kind: Service
metadata:
  name: aceest-prod-svc
  namespace: aceest
spec:
  type: NodePort
  selector: { app: aceest-prod }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
---
# Internal-only service for the mirror job to send copied requests to.
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
  namespace: aceest
spec:
  type: ClusterIP
  selector: { app: aceest-shadow }
  ports:
    - port: 80
      targetPort: 5000
