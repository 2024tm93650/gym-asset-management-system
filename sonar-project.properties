# SonarQube project configuration for ACEest Fitness
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=1.0.0

# Source / test layout
sonar.sources=app
sonar.tests=tests
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python coverage report from pytest-cov
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.version=3.12

# Exclude virtualenv, build artefacts and test code from duplication / coverage targets
sonar.exclusions=.venv/**,reports/**,**/__pycache__/**,**/*.pyc,jenkins/**,sonarqube/**,k8s/**
sonar.coverage.exclusions=tests/**,ACEest_Fitness.py
